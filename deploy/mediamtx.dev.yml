# MediaMTX for local development on one machine (not for servers - see mediamtx.yml).
#   tools\mediamtx\mediamtx.exe deploy\mediamtx.dev.yml
# Watch a published path in the browser: http://127.0.0.1:8889/<path>

logLevel: info

api: yes
apiAddress: 127.0.0.1:9997
playback: no

rtsp: yes
rtspAddress: 127.0.0.1:8554
protocols: [tcp]  # no UDP listeners (UDP 8000 would sit next to the API's dev port)
rtmp: no
srt: no
hls: no

webrtc: yes
webrtcAddress: 127.0.0.1:8889
webrtcLocalUDPAddress: 127.0.0.1:8189
webrtcAdditionalHosts: [127.0.0.1]

# Only this machine may publish/read.
authMethod: internal
authInternalUsers:
  - user: any
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: publish
      - action: read
      - action: api

pathDefaults:
  rtspTransport: tcp
  record: no

paths:
  all_others:
